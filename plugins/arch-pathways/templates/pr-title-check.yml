name: PR title check (arch-pathways)
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -qE '^[A-Z][A-Z0-9]*-[0-9]+ [A-Z]'; then
            echo "::error::PR title must match '<PREFIX>-<N> Title Case Slug' (e.g. 'TRAY-42 Fold Installs Into Config Dir'). Run pid-new from the arch-pathways plugin to mint properly."
            exit 1
          fi

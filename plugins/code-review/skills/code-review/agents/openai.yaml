interface:
  display_name: "Code Review"
  short_description: "Review code with focused agents."
  default_prompt: |
    Use code-review to run a read-only code review or multi-domain review board.
    Route first with the lightweight reviewer selector unless the user named reviewers.
    Use the canonical reviewer catalog from the skill. In Claude Code, real agent
    files may provide model-specific execution. In Codex, prompt reviewer roles
    explicitly and do not assume named .codex/agents TOML files are applied.
    Spawn independent domain reviewers only when useful, then synthesize findings into:
    verdict (pass | conditional | block), must-fix items, deferred follow-ups,
    contextual quick wins, verification commands, and a compact machine-parseable
    result block.

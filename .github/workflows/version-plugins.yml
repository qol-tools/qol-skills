name: version plugins

on:
  workflow_dispatch:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: version-plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump drifted plugin versions
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump drifted plugin versions
        id: bump
        run: |
          bumped=$(node scripts/plugin-bump.cjs)
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
          if [ -n "$bumped" ]; then
            echo "### Version bumps" >> "$GITHUB_STEP_SUMMARY"
            echo "$bumped" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit version bump
        id: commit
        if: steps.bump.outputs.bumped != ''
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Drift reported but no diff produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/plugins/marketplace.json .claude-plugin/marketplace.json .kimi-plugin/marketplace.json plugins
          git commit -m "chore(plugins): bump plugin versions"
          if ! git push origin "HEAD:main"; then
            git fetch origin main
            if [ "$(git rev-parse FETCH_HEAD)" != "${SOURCE_SHA}" ]; then
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              echo "::notice::main moved past ${SOURCE_SHA}; the newer push's versioning run takes over"
              exit 0
            fi
            exit 1
          fi

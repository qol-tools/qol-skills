name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  hook-tests:
    name: hook tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check plugin manifests
        shell: bash
        run: node scripts/sync-plugin-manifests.cjs --check
      - name: Check skill invariants
        shell: bash
        run: node scripts/check-skill-invariants.cjs --check
      - name: Run all hook tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(test/*.test.cjs plugins/*/test/*.test.cjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No hook tests found — nothing to run."
            exit 0
          fi
          node --test "${tests[@]}"
